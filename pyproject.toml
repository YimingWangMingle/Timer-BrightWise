[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tsfm"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "torch>=2.3,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
server = ["datasets>=3,<5", "psutil>=6,<8", "tqdm>=4.66,<5"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
